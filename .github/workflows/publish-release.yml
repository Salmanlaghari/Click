name: Publish GitHub Release

# Manually dispatched: attaches an ALREADY-BUILT release-signed APK (from a
# previous build run's "Click-Browser-Release" artifact) to a GitHub Release.
# Nothing is rebuilt here, and the APK's SHA-256 is verified against the
# known-good value before anything is published — a mismatch fails the job.
# (Direct API asset upload is not available to our automation, so the
# upload happens here, inside Actions, with the workflow's own token.)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v1.8.0"
      run_id:
        description: "Actions run ID whose Click-Browser-Release artifact holds the APK"
        required: true
        default: "43612818349"

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    name: Publish release with signed APK
    runs-on: ubuntu-latest
    steps:
      # This workflow is PINNED to the 1.8.0 (code 21) release: the APK name,
      # its SHA-256 and the notes below are constants for that exact build.
      # The inputs exist so the pinned values are visible at dispatch time —
      # fail fast on anything else instead of publishing mismatched metadata.
      # For a future release, update the pinned constants in this file.
      - name: Validate pinned inputs
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ "$TAG" != "v1.8.0" ] || [ "$RUN_ID" != "43612818349" ]; then
            echo "::error::This workflow is pinned to the 1.8.0 release (tag v1.8.0, run 43612818349); got tag=$TAG run_id=$RUN_ID. Update the pinned constants in publish-release.yml for a different release."
            exit 1
          fi

      - name: Download the built release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Click-Browser-Release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename and verify the APK
        run: |
          mv app-release.apk Click-Browser-1.8.0.apk
          echo "1b16b5ded7228a67b2df7d6c0d63b5bc4f47b6791a6575a707f071c687394cce  Click-Browser-1.8.0.apk" | sha256sum -c -
          ls -la Click-Browser-1.8.0.apk

      - name: Write release notes
        run: |
          cat > notes.md << 'EOF'
          ## Click Browser 1.8.0 (versionCode 21)

          ### Highlights
          - Thin address bar at the top in all four modes
          - Centre "Loading page..." dialog removed
          - Full-screen web pages — the bottom bar hides on websites, back on the home/dashboard
          - Back button fixed: returns to the previous page instead of jumping Home on popup tabs
          - Bigger download card with honest timing (real measured speed/ETA; elapsed time when the size is unknown — never an invented ETA)
          - Download pause / resume / cancel with progress notifications
          - In-app APK install (Click asks for the install permission itself)
          - Site Settings with real enforcement
          - 9 search engines to choose from

          ### Download
          - **Click-Browser-1.8.0.apk** — release-signed with the Click keystore.
          - SHA-256: `1b16b5ded7228a67b2df7d6c0d63b5bc4f47b6791a6575a707f071c687394cce`

          This is the same build as the Click 1.8.0 (code 21) draft on Google Play.
          EOF
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this workflow, so gh cannot infer the repo from a
          # local .git — name it explicitly (first dispatch failed on this).
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Deliberately NOT idempotent: re-publishing over an existing
          # release must be a conscious manual act, never a silent clobber.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete it manually first if re-publishing is intended."
            exit 1
          fi
          gh release create "$TAG" Click-Browser-1.8.0.apk \
            --title "Click Browser 1.8.0" \
            --notes-file notes.md
