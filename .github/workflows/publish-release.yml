name: Publish GitHub Release

# Manually dispatched: attaches an ALREADY-BUILT release-signed APK (from a
# previous build run's "Click-Browser-Release" artifact) to a GitHub Release.
# Nothing is rebuilt here, and the APK's SHA-256 is verified against the
# known-good value before anything is published — a mismatch fails the job.
# (Direct API asset upload is not available to our automation, so the
# upload happens here, inside Actions, with the workflow's own token.)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v1.8.2"
      run_id:
        description: "Actions run ID whose Click-Browser-Release artifact holds the APK"
        required: true
        default: "43821623060"

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    name: Publish release with signed APK
    runs-on: ubuntu-latest
    steps:
      # This workflow is PINNED to the 1.8.2 (code 23) release: the APK name,
      # its SHA-256 and the notes below are constants for that exact build.
      # The inputs exist so the pinned values are visible at dispatch time —
      # fail fast on anything else instead of publishing mismatched metadata.
      # For a future release, update the pinned constants in this file.
      - name: Validate pinned inputs
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ "$TAG" != "v1.8.2" ] || [ "$RUN_ID" != "43821623060" ]; then
            echo "::error::This workflow is pinned to the 1.8.2 release (tag v1.8.2, run 43821623060); got tag=$TAG run_id=$RUN_ID. Update the pinned constants in publish-release.yml for a different release."
            exit 1
          fi

      - name: Download the built release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Click-Browser-Release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename and verify the APK
        run: |
          mv app-release.apk Click-Browser-1.8.2.apk
          echo "5a4fbc3e06742de759c3054670870fbd321311744bf52fb970f9981f95960510  Click-Browser-1.8.2.apk" | sha256sum -c -
          ls -la Click-Browser-1.8.2.apk

      - name: Write release notes
        run: |
          cat > notes.md << 'EOF'
          ## Click Browser 1.8.2 (versionCode 23)

          ### Fix
          - **"Page couldn't load" card on every site — fixed.** A stray Gecko load-error event (for example from a previous page's subresource) could be attributed to the page currently loading and then veto its successful load, so site after site showed the recovery card over a blank page. Load errors are now attributed only on an exact URL match, and a page that loads successfully always displays its content.
          - When a page genuinely fails to load, the recovery card now shows the concrete reason (for example DNS, timeout, or connection refused) so the failure is diagnosable.

          ### Download
          - **Click-Browser-1.8.2.apk** — release-signed with the Click keystore.
          - SHA-256: `5a4fbc3e06742de759c3054670870fbd321311744bf52fb970f9981f95960510`

          This is the same build as the Click 1.8.2 (code 23) draft on Google Play.
          EOF
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this workflow, so gh cannot infer the repo from a
          # local .git — name it explicitly (first dispatch failed on this).
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Deliberately NOT idempotent: re-publishing over an existing
          # release must be a conscious manual act, never a silent clobber.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete it manually first if re-publishing is intended."
            exit 1
          fi
          gh release create "$TAG" Click-Browser-1.8.2.apk \
            --title "Click Browser 1.8.2" \
            --notes-file notes.md
