name: Build and Package APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # libbox.aar (sing-box VPN core): built from official source by the
      # build-libbox.yml workflow. Restored from cache if the version pin
      # hasn't changed; otherwise downloaded from the workflow artifact.
      - name: Restore libbox.aar from cache
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-v1.14.3-aar

      - name: Verify libbox.aar present
        run: |
          if [ ! -f app/libs/libbox.aar ]; then
            echo "::error::app/libs/libbox.aar missing — run the 'Build libbox.aar' workflow first."
            exit 1
          fi
          ls -lh app/libs/libbox.aar

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # NOTE: AGP generates the debug keystore automatically — no manual step needed.
      # Release APKs MUST be signed with Prince's real keystore (same as
      # build-release.yml). A debug-signed "release" APK trips the in-app
      # tamper warning on install — so we fail loudly instead of silently
      # shipping a wrongly-signed artifact (Prince's rule: no improperly
      # signed APKs, ever).
      - name: Setup release signing (real keystore)
        env:
          KEYSTORE_B64: ${{ secrets.CLICK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLICK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLICK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLICK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/click-release.p12
            # Validate the FULL signing chain with a real trial signature.
            APKSIGNER_BIN=$(echo "$ANDROID_HOME"/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
            echo "trial" > /tmp/dummy.txt && (cd /tmp && zip -q dummy.zip dummy.txt)
            if "$APKSIGNER_BIN" sign \
                --ks app/click-release.p12 \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASSWORD" \
                --min-sdk-version 26 \
                --out /tmp/dummy-signed.apk /tmp/dummy.zip 2>/tmp/sign-err.log; then
              {
                echo "CLICK_KEYSTORE_FILE=$GITHUB_WORKSPACE/app/click-release.p12"
                echo "CLICK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
                echo "CLICK_KEY_ALIAS=$KEY_ALIAS"
                echo "CLICK_KEY_PASSWORD=$KEY_PASSWORD"
              } >> "$GITHUB_ENV"
              echo "Release signing configured from secrets (trial signature OK)."
            else
              echo "ERROR: release keystore secrets failed validation — refusing to build a wrongly-signed release APK."
              head -5 /tmp/sign-err.log
              exit 1
            fi
          else
            echo "ERROR: CLICK_KEYSTORE_BASE64 secret is missing — refusing to build a wrongly-signed release APK."
            exit 1
          fi

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./gradlew assembleDebug

      - name: Build Release APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLICK_KEYSTORE_FILE: ${{ env.CLICK_KEYSTORE_FILE }}
          CLICK_KEYSTORE_PASSWORD: ${{ env.CLICK_KEYSTORE_PASSWORD }}
          CLICK_KEY_ALIAS: ${{ env.CLICK_KEY_ALIAS }}
          CLICK_KEY_PASSWORD: ${{ env.CLICK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release signature (must be Prince's key)
        run: |
          APKSIGNER=$(echo "$ANDROID_HOME"/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1|SHA-256"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Click-Browser-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Click-Browser-Release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
