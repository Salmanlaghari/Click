name: React Preview Checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/react-preview-checks.yml'

permissions:
  contents: read

jobs:
  react-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install React preview dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Type-check React preview
        run: npm run lint

      - name: Build React preview
        run: npm run build
