name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Release Keystore
        run: |
          if [ ! -f release-key.jks ]; then
            keytool -genkey -v -keystore release-key.jks -alias click -keyalg RSA -keysize 2048 -validity 10000 -storepass click123 -keypass click123 -dname "CN=Click, OU=Click, O=Click, L=Click, S=Click, C=US"
          fi

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Click-Browser-Release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Click Browser ${{ github.ref_name }}
          body: |
            ## Click Browser ${{ github.ref_name }}
            - ✅ Simple Mode
            - ✅ Developer Mode (DevTools)
            - ✅ Hack Mode (Anti-Detection + Video Downloader)
            - ✅ Bookmarks, History, Downloads
            - ✅ Night Mode & Themes
            - ✅ Privacy & Security
          files: app/build/outputs/apk/release/app-release.apk
